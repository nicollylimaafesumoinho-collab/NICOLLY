<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum de Fotos Offline</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsivo.css">
   
    <script src="js/script.js" defer></script>
</head>

<body>

    <h1 class="titulo-album">Porto Seguro</h1>
    <div class="subtitulo-album">Família é a base que sustenta, Mesmo quando cada um segue seu próprio caminho.</div>

    <div class="album-container">
        
        <div class="foto-box" onclick="abrirModal('img/foto1.jpeg', 'Lembranças')">
            <img src="img/foto1.jpeg" alt="Mãe">
            <div class="legenda">Mãe</div>
        </div>
   
        <div class="foto-box" onclick="abrirModal('img/foto2.jpeg', 'Diversão')">
            <img src="img/foto2.jpeg" alt="Irmão">
            <div class="legenda">Irmão</div>
        </div>

        <div class="foto-box" onclick="abrirModal('img/foto3.jpeg', 'Saudades')">
            <img src="img/foto3.jpeg" alt="Vô">
            <div class="legenda">Vô</div>
        </div>

        <div class="foto-box" onclick="abrirModal('img/foto4.jpeg', 'Irmã de coração')">
            <img src="img/foto4.jpeg" alt="Amizade">
            <div class="legenda">Amizade</div>
        </div>

        <div class="foto-box" onclick="abrirModal('img/foto5.jpeg', 'Segunda Mãe')">
            <img src="img/foto5.jpeg" alt="Vó">
            <div class="legenda">Vó</div>
        </div>

        <div class="foto-box" onclick="abrirModal('img/foto6.jpeg', 'Memórias')">
            <img src="img/foto6.jpeg" alt="Pai">
            <div class="legenda">Pai</div>
        </div>
    </div>

    <audio controls autoplay loop class="musica-fundo">
        <source src="audio/Pyramids.mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <div class="container-botao-voltar">
        <a href="index.html" class="botao-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="modal" id="meuModal">
        <span class="btn-fechar" onclick="fecharModal()">&times;</span>
        <img id="imagemModal" src="" alt="Foto em tela cheia">
        <div class="legenda-modal" id="textoModal"></div>
    </div>


    
</body>
</html>
